<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Candidatos do ES</title>
	<link rel="stylesheet" href="navegacao.css">
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; color: #202b35; background: #f3f6f4; font-family: 'Segoe UI', Tahoma, sans-serif; }
		body { padding-bottom: 24px; }
		main { width: min(1100px, 100%); margin: 0 auto; padding: 36px 24px 64px; }
		header { border-bottom: 1px solid #cbd5d0; padding: 8px 0 24px; }
		h1 { margin: 0 0 8px; font-size: 2rem; }
		header p { margin: 0; color: #58665f; }
		.candidate-search { max-width: 760px; margin: 28px auto 0; }
		.search-container { max-width: 700px; margin: 0 auto; padding: 0 16px; }
		.search-box { display: flex; overflow: hidden; border: 2px solid #e2e8f0; border-radius: 50px; background: #fff; box-shadow: 0 10px 25px rgba(0, 0, 0, .1); transition: border-color .2s, box-shadow .2s; }
		.search-box:focus-within { border-color: #3182ce; box-shadow: 0 10px 25px rgba(49, 130, 206, .2); }
		.search-input { flex: 1; min-width: 0; min-height: 54px; padding: 12px 24px; border: 0; outline: 0; background: transparent; color: #2d3748; font: inherit; font-size: 1.05rem; }
		.search-btn { min-height: 54px; padding: 0 24px; border: 0; border-radius: 0; background: #3182ce; color: #fff; font: inherit; font-weight: 600; cursor: pointer; transition: background .2s; }
		.search-btn:hover { background: #2b6cb0; }
		.filters { display: flex; justify-content: center; gap: 16px; padding: 20px 16px 12px; }
		label { display: grid; gap: 6px; color: #425149; font-size: .9rem; font-weight: 600; }
		.filters input, .filters select { min-height: 42px; border: 1px solid #aab8af; border-radius: 4px; background: #fff; color: #202b35; font: inherit; padding: 0 12px; }
		#filterCargo { min-width: 220px; }
		#filterPartido { min-width: 180px; }
		#filterYear { width: 150px; }
		#loadMore { min-height: 44px; border: 1px solid #3182ce; border-radius: 4px; background: #3182ce; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
		#loadMore:hover { background: #2b6cb0; }
		#status { min-height: 26px; color: #58665f; }
		.results { overflow-x: auto; border-top: 1px solid #cbd5d0; scrollbar-width: none; }
		.results::-webkit-scrollbar { display: none; }
		#horizontalScrollbar { position: fixed; z-index: 10; right: 0; bottom: 0; left: 0; height: 24px; overflow-x: auto; overflow-y: hidden; border-top: 1px solid #cbd5d0; background: #f3f6f4; scrollbar-color: #718096 #e2e8f0; scrollbar-width: auto; }
		#horizontalScrollbarContent { height: 1px; }
		#horizontalScrollbar::-webkit-scrollbar { height: 16px; }
		#horizontalScrollbar::-webkit-scrollbar-track { background: #e2e8f0; }
		#horizontalScrollbar::-webkit-scrollbar-thumb { border: 2px solid #e2e8f0; border-radius: 8px; background: #718096; }
		table { width: 100%; border-collapse: collapse; text-align: left; }
		th, td { padding: 12px 10px; border-bottom: 1px solid #dbe2de; vertical-align: top; }
		th { color: #425149; font-size: .82rem; font-weight: 700; }
		td { font-size: .94rem; }
		.name { font-weight: 650; }
		.name a { color: inherit; text-decoration: none; }
		.name a:hover, .name a:focus-visible { color: #2b6cb0; text-decoration: underline; }
		.candidate-photo { width: 48px; height: 48px; object-fit: cover; border-radius: 50%; }
		#loadMore { display: block; margin: 20px auto 0; padding: 0 20px; }
		@media (max-width: 720px) {
			main { padding: 24px 16px 48px; }
			.filters { flex-wrap: wrap; justify-content: stretch; }
			.filters label { flex: 1 1 140px; }
			#filterCargo, #filterPartido, #filterYear { width: 100%; min-width: 0; }
		}
		@media (max-width: 480px) {
			.search-container { padding: 0; }
			.search-input { padding: 10px 16px; font-size: .95rem; }
			.search-btn { padding: 0 16px; }
		}
	</style>
</head>
<body>
	<nav class="page-tabs" aria-label="Navegação principal">
		<a href="paginainicial.html">Página inicial</a>
		<span aria-current="page">Candidatos do ES</span>
	</nav>
	<main>
		<form class="candidate-search" id="searchForm">
			<div class="search-container">
				<div class="search-box">
					<input id="searchName" class="search-input" type="search" placeholder="Pesquisar candidatos pelo nome..." autocomplete="off" aria-label="Pesquisar candidatos pelo nome">
					<button class="search-btn" type="submit">Pesquisar</button>
				</div>
			</div>
			<div class="filters">
			<label>Cargo
				<select id="filterCargo">
					<option value="">Todos os cargos</option>
					<option value="GOVERNADOR">Governador</option>
					<option value="VICE-GOVERNADOR">Vice-governador</option>
					<option value="SENADOR">Senador</option>
					<option value="DEPUTADO FEDERAL">Deputado Federal</option>
					<option value="DEPUTADO ESTADUAL">Deputado Estadual</option>
					<option value="PREFEITO">Prefeito</option>
					<option value="VEREADOR">Vereador</option>
				</select>
			</label>
			<label>Partido político
				<select id="filterPartido">
					<option value="">Todos os partidos</option>
				</select>
			</label>
			<label>Ano
				<input id="filterYear" type="number" min="1900" max="2100" value="2026" readonly placeholder="Todos">
			</label>
			</div>
		</form>
		<p id="status" role="status" aria-live="polite">Carregando candidaturas...</p>
		<div class="results">
			<table>
				<thead><tr><th>Foto</th><th>Nome de urna</th><th>Partido</th><th>Cargo</th><th>Número</th><th>Ano</th><th>Município</th><th>Situação</th></tr></thead>
				<tbody id="candidateRows"></tbody>
			</table>
		</div>
		<button id="loadMore" type="button" hidden>Carregar mais</button>
	</main>
	<div id="horizontalScrollbar" role="region" aria-label="Barra de rolagem horizontal da tabela" tabindex="0">
		<div id="horizontalScrollbarContent"></div>
	</div>
	<script>
		const form = document.getElementById('searchForm');
		const status = document.getElementById('status');
		const rows = document.getElementById('candidateRows');
		const loadMore = document.getElementById('loadMore');
		const filterPartido = document.getElementById('filterPartido');
		const filterYear = document.getElementById('filterYear');
		const results = document.querySelector('.results');
		const horizontalScrollbar = document.getElementById('horizontalScrollbar');
		const horizontalScrollbarContent = document.getElementById('horizontalScrollbarContent');
		let offset = 0;
		let total = 0;

		function updateHorizontalScrollbar() {
			horizontalScrollbarContent.style.width = `${results.scrollWidth}px`;
			horizontalScrollbar.scrollLeft = results.scrollLeft;
		}

		results.addEventListener('scroll', () => {
			horizontalScrollbar.scrollLeft = results.scrollLeft;
		});
		horizontalScrollbar.addEventListener('scroll', () => {
			results.scrollLeft = horizontalScrollbar.scrollLeft;
		});
		window.addEventListener('resize', updateHorizontalScrollbar);
		updateHorizontalScrollbar();

		function buildFallbackPhoto(name) {
			const initials = (name || 'C').trim().split(/\s+/).slice(0, 2).map((part) => part.charAt(0).toUpperCase()).join('').slice(0, 2) || 'C';
			const svg = `
				<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
					<rect width="96" height="96" rx="48" fill="#dfeaf7"/>
					<circle cx="48" cy="36" r="18" fill="#4a6fa5"/>
					<path d="M24 78c3-15 15-22 24-22s21 7 24 22" fill="#4a6fa5"/>
					<text x="48" y="82" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">${initials}</text>
				</svg>
			`;
			return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
		}

		function addCell(row, value, className) {
			const cell = document.createElement('td');
			cell.textContent = value || '—';
			if (className) cell.className = className;
			row.append(cell);
		}

		function showEmptyState(message) {
			rows.replaceChildren();
			const row = document.createElement('tr');
			const cell = document.createElement('td');
			cell.colSpan = 8;
			cell.textContent = message;
			cell.style.textAlign = 'center';
			cell.style.padding = '24px 12px';
			cell.style.color = '#58665f';
			cell.style.fontWeight = '600';
			row.append(cell);
			rows.append(row);
		}

		async function search(append = false) {
			if (!append) {
				offset = 0;
				rows.replaceChildren();
			}
			status.textContent = 'Buscando...';
			loadMore.hidden = true;
			const params = new URLSearchParams({
				q: document.getElementById('searchName').value.trim(),
				cargo: document.getElementById('filterCargo').value,
				partido: filterPartido.value,
				ano: filterYear.value || '2026',
				offset: String(offset),
				limit: '10'
			});
			try {
				const response = await fetch(`/api/candidatos?${params}`);
				const payload = await response.json();
				if (!response.ok) throw new Error(payload.error || 'Falha na consulta.');
				for (const candidate of payload.resultados) {
					const row = document.createElement('tr');
					const photoCell = document.createElement('td');
					const photo = document.createElement('img');
					photo.className = 'candidate-photo';
					photo.alt = `Foto de ${candidate.nome_urna || candidate.nome}`;
					photo.loading = 'lazy';
					const photoSrc = candidate.imagem_url || buildFallbackPhoto(candidate.nome_urna || candidate.nome);
					photo.src = photoSrc;
					photo.addEventListener('error', () => {
						photo.src = buildFallbackPhoto(candidate.nome_urna || candidate.nome);
					});
					photoCell.append(photo);
					row.append(photoCell);
					const nameCell = document.createElement('td');
					nameCell.className = 'name';
					const profileLink = document.createElement('a');
					profileLink.href = `candidato.html?id=${encodeURIComponent(candidate.id_tse)}`;
					profileLink.textContent = candidate.nome_urna || candidate.nome;
					profileLink.setAttribute('aria-label', `Ver perfil de ${candidate.nome_urna || candidate.nome}`);
					nameCell.append(profileLink);
					row.append(nameCell);
					addCell(row, candidate.partido);
					addCell(row, candidate.cargo);
					addCell(row, candidate.numero);
					addCell(row, candidate.ano);
					addCell(row, candidate.municipio);
					addCell(row, candidate.situacao);
					rows.append(row);
				}
				updateHorizontalScrollbar();
				total = payload.total;
				offset += payload.resultados.length;

				if (!total) {
					showEmptyState('Nenhuma candidatura encontrada para os filtros atuais. Tente outro nome, cargo ou ano.');
					status.textContent = 'Nenhuma candidatura encontrada.';
					return;
				}

				status.textContent = `${total} candidatura(s) encontrada(s).`;
				loadMore.hidden = offset >= total;
			} catch (error) {
				showEmptyState('Não foi possível carregar os candidatos no momento. Tente novamente mais tarde.');
				status.textContent = error.message;
			}
		}

		form.addEventListener('submit', (event) => { event.preventDefault(); search(); });
		filterPartido.addEventListener('change', () => search());
		filterYear.value = '2026';
		filterYear.setAttribute('readonly', 'readonly');
		filterYear.addEventListener('change', () => {
			filterYear.value = '2026';
			search();
		});
		loadMore.addEventListener('click', () => search(true));

		async function loadPartidos() {
			try {
				const response = await fetch('/api/candidatos/partidos');
				const payload = await response.json();
				if (!response.ok) throw new Error(payload.error || 'Não foi possível carregar os partidos.');

				for (const partido of payload.partidos) {
					const option = document.createElement('option');
					option.value = partido;
					option.textContent = partido;
					filterPartido.append(option);
				}
			} catch (error) {
				status.textContent = `Não foi possível carregar a lista de partidos: ${error.message}`;
			}
		}

		filterYear.value = '2026';
		loadPartidos().finally(() => search());
	</script>
</body>
</html>
